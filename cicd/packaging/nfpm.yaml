# nfpm config template for the .deb/.rpm packages (https://nfpm.goreleaser.com).
# cicd/utility/package.bash sed-renders the ${SHCL_*} placeholders per build
# (nfpm does not expand env vars in contents src). SHCL_PAYLOAD = staged
# code/ + scripts/ trees; payload mirrors install.bash.
name: shcl
arch: ${SHCL_ARCH}
platform: linux
version: ${SHCL_VERSION}
section: utils
priority: optional
maintainer: Jim Collier <32471972+jim-collier@users.noreply.github.com>
description: |
  Simple Hierarchical Config Language.
  Reference parser, accessor, writer, and CLI, with drop-in language
  bindings (Rust, Go, Python, C/C++) and Bash/PowerShell wrappers.
homepage: https://github.com/jim-collier/shcl
license: MIT
rpm:
  # rpm stamps the building machine's hostname into the package; a fixed name
  # keeps two builds of one commit byte-identical (the build date comes from
  # SOURCE_DATE_EPOCH, which package.bash exports).
  buildhost: localhost
contents:
  - src: ${SHCL_BIN}
    dst: /usr/bin/shcl
    file_info:
      mode: 0755
  - src: ${SHCL_PAYLOAD}/code
    dst: /usr/share/shcl/code
    type: tree
  - src: ${SHCL_PAYLOAD}/scripts
    dst: /usr/share/shcl/scripts
    type: tree
  - src: ${SHCL_PAYLOAD}/man/shcl.1.gz
    dst: /usr/share/man/man1/shcl.1.gz
    file_info:
      mode: 0644
  # Completions go to the shell's own directory, not under /usr/share/shcl:
  # bash-completion and zsh only autoload from theirs.
  - src: ${SHCL_PAYLOAD}/completions/shcl.bash
    dst: /usr/share/bash-completion/completions/shcl
    file_info:
      mode: 0644
  - src: ${SHCL_PAYLOAD}/completions/_shcl
    dst: /usr/share/zsh/site-functions/_shcl
    file_info:
      mode: 0644
